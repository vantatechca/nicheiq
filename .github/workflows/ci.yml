name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test
        env:
          USE_MOCK: "true"
          NEXTAUTH_SECRET: "ci-secret-not-real"

      - name: Build
        run: npm run build
        env:
          USE_MOCK: "true"
          NEXTAUTH_SECRET: "ci-secret-not-real"

  e2e: # ← this is the start of the next job, leave it alone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          USE_MOCK: "true"
          NEXTAUTH_SECRET: "ci-secret-not-real"

      - name: E2E tests
        run: npm run test:e2e
        env:
          USE_MOCK: "true"
          NEXTAUTH_SECRET: "ci-secret-not-real"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
